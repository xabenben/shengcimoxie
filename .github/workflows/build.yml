name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            python3-dev \
            libltdl-dev \
            lld \
            clang \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake
          pip install --upgrade pip
          pip install --upgrade buildozer cython "kivy[base]"

      - name: Build APK with Buildozer
        run: |
          # 设置自动同意协议的环境变量，避免触发 yes 命令管道破裂
          export ACCEPT_BUILD_TOOLS_CHECKSUMS=true
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: WordReader-APK
          path: bin/*.apk
