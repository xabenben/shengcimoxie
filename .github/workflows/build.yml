name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies & Android SDK Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk android-sdk
          pip install --upgrade buildozer cython

      - name: Pre-accept Android Licenses & Install AIDL
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # 自动接受 Android SDK 协议并安装包含 aidl 的 build-tools 33.0.2
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.2" "platforms;android-31" || true

      - name: Build APK with Buildozer
        run: |
          # 自动接受 Buildozer 生成的 SDK 协议
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: WordReader-APK
          path: bin/*.apk
